# `make deny` runs every check below. Each new dependency needs an entry in [bans] allow, with the reason it is
# needed, before `make check` passes (AGENTS.md).

[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
# Each entry is a crate deep in Typst's tree (render-typst, issue #7) that Typst 0.15.1 pins, so kariera cannot
# upgrade or drop it. Recheck them all when Typst is bumped.
ignore = [
  { id = "RUSTSEC-2024-0320", reason = "yaml-rust, unmaintained: syntect, Typst's code highlighter, reads its syntaxes with it; the documents highlight no code" },
  { id = "RUSTSEC-2024-0436", reason = "paste, unmaintained: a macro biblatex uses at compile time; nothing of it runs in kariera" },
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml, unmaintained: serde_yaml behind Typst's yaml(); the templates read no YAML" },
  { id = "RUSTSEC-2025-0141", reason = "bincode, unmaintained: syntect loads its bundled syntaxes with it; the documents highlight no code" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser, unmaintained: Typst reads every font with it; the fonts are the ones embedded in the binary" },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz, unmaintained: Typst's text shaping; it only shapes the documents' own text with the embedded fonts" },
  { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38, quadratic attribute check: citationberg reads bibliography styles with it; the documents cite nothing and Typst reads no XML from outside the binary" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.38, namespace allocation: citationberg reads bibliography styles with it; the documents cite nothing and Typst reads no XML from outside the binary" },
  { id = "RUSTSEC-2026-0367", reason = "zip 8.6.0, which docx-rs pins: a flaw in ZipArchive::extract; render-docx only writes archives and never extracts or reads one" },
  { id = "RUSTSEC-2026-0368", reason = "zip 8.6.0, which docx-rs pins: a flaw in ZipArchive::extract; render-docx only writes archives and never extracts or reads one" },
  { id = "RUSTSEC-2026-0369", reason = "zip 8.6.0, which docx-rs pins: a flaw in ZipArchive::extract and ZipStreamReader; render-docx only writes archives and never extracts or reads one" },
  { id = "RUSTSEC-2026-0429", reason = "zip 8.6.0, which docx-rs pins: a flaw in ZipArchive::extract; render-docx only writes archives and never extracts or reads one" },
  { id = "RUSTSEC-2026-0545", reason = "zip 8.6.0, which docx-rs pins: a flaw in reading AES entries; render-docx only writes archives and never extracts or reads one" },
  { id = "RUSTSEC-2026-0546", reason = "zip 8.6.0, which docx-rs pins: a flaw in ZipArchive::extract; render-docx only writes archives and never extracts or reads one" },
  { id = "RUSTSEC-2026-0547", reason = "zip 8.6.0, which docx-rs pins: a flaw in the legacy Shrink, Reduce and Implode decoders; render-docx only writes archives and never extracts or reads one" },
  { id = "RUSTSEC-2026-0548", reason = "zip 8.6.0, which docx-rs pins: a flaw in ZipStreamReader; render-docx only writes archives and never extracts or reads one" },
]

[licenses]
# Permissive licences only. A copyleft licence would bind the whole binary, so it needs a decision first.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
]
confidence-threshold = 0.93
# Listed ahead of the dependencies that will need them, so the list is the policy rather than an inventory.
unused-allowed-license = "allow"

[[licenses.exceptions]]
# biblatex, inside Typst, needs it. 0BSD is the BSD licence without even the notice requirement: more permissive
# than anything on the list above, and allowed for this crate only.
crate = "roman-numerals-rs"
allow = ["0BSD"]

[licenses.private]
# The workspace crates are unpublished and have no licence of their own yet.
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Path dependencies between workspace crates carry no version, which is not a crates.io wildcard.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
# The crate allowlist. A non-empty list refuses every crate it does not name, so the workspace crates are listed too.
