# `make deny` runs every check below. Each new dependency needs an entry in [bans] allow, with the reason it is
# needed, before `make check` passes (AGENTS.md).

[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = []

[licenses]
# Permissive licences only. A copyleft licence would bind the whole binary, so it needs a decision first.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
]
confidence-threshold = 0.93
# Listed ahead of the dependencies that will need them, so the list is the policy rather than an inventory.
unused-allowed-license = "allow"

[licenses.private]
# The workspace crates are unpublished and have no licence of their own yet.
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Path dependencies between workspace crates carry no version, which is not a crates.io wildcard.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
# The crate allowlist. A non-empty list refuses every crate it does not name, so the workspace crates are listed too.
# Each third-party entry states why kariera needs it. The boundaries between the workspace crates are checked
# separately, by crate-boundaries.toml, because cargo-deny refuses a crate named in both `allow` and `deny`.
allow = [
  { crate = "kariera-cli", reason = "workspace crate" },
  { crate = "kariera-documents", reason = "workspace crate" },
  { crate = "kariera-domain", reason = "workspace crate" },
  { crate = "kariera-render-docx", reason = "workspace crate" },
  { crate = "kariera-render-typst", reason = "workspace crate" },
  { crate = "kariera-render-xlsx", reason = "workspace crate" },
  { crate = "kariera-validate", reason = "workspace crate" },
  { crate = "kariera-vault", reason = "workspace crate" },
  # Reading the vault.
  { crate = "saphyr-parser", reason = "YAML parser for note frontmatter; its events keep the line and quoting of every value, which the schema's rules and error messages need" },
  { crate = "arraydeque", reason = "saphyr-parser: the scanner's token buffer" },
  { crate = "unicode-normalization", reason = "NFC for note names and link targets (vault schema §1.1): macOS and Syncthing also write NFD" },
  { crate = "tinyvec", reason = "unicode-normalization: small buffers for combining characters" },
  { crate = "toml", reason = "reads ~/.config/kariera/config.toml" },
  { crate = "toml_parser", reason = "toml: the parser" },
  { crate = "toml_datetime", reason = "toml: TOML date values" },
  { crate = "serde_spanned", reason = "toml: positions for error messages" },
  { crate = "winnow", reason = "toml: parser combinators of toml_parser" },
  { crate = "serde", reason = "derives the deserialization of config.toml into a struct" },
  { crate = "serde_core", reason = "serde: the traits, split out of serde" },
  { crate = "serde_derive", reason = "serde: the derive macros" },
  { crate = "sha2", reason = "SHA-256 for translation fingerprints (ADR 0002): a frozen, published algorithm that anyone can recompute with `shasum`; hand-written crypto is not worth the risk" },
  { crate = "digest", reason = "sha2: the hash traits" },
  { crate = "crypto-common", reason = "digest: shared traits of hash types" },
  { crate = "block-buffer", reason = "digest: buffers input into hash blocks" },
  { crate = "hybrid-array", reason = "crypto-common and block-buffer: fixed-size arrays of a size known at compile time" },
  { crate = "typenum", reason = "hybrid-array: type-level numbers for those sizes" },
  { crate = "cpufeatures", reason = "sha2: detects CPU instructions for SHA-256" },
  # Error types.
  { crate = "thiserror", reason = "derives Display and Error for the error enums, so each message sits on its variant" },
  { crate = "thiserror-impl", reason = "thiserror: the derive macro" },
  # Derive macros of serde and thiserror.
  { crate = "proc-macro2", reason = "serde_derive and thiserror-impl: token streams" },
  { crate = "quote", reason = "serde_derive and thiserror-impl: code generation" },
  { crate = "syn", reason = "serde_derive and thiserror-impl: parsing Rust code" },
  { crate = "unicode-ident", reason = "proc-macro2 and syn: identifier characters" },
  # Snapshot tests, dev-dependencies only.
  { crate = "insta", reason = "snapshot tests of whole values, such as the loaded fixture vault (docs/rust-primer.md)" },
  { crate = "similar", reason = "insta: the diff of a changed snapshot" },
  { crate = "once_cell", reason = "insta and tempfile: lazily initialised statics" },
  { crate = "tempfile", reason = "insta: writes snapshot files atomically" },
  { crate = "fastrand", reason = "tempfile: random temporary file names" },
  { crate = "getrandom", reason = "tempfile: seeds the random names from the OS" },
  { crate = "cfg-if", reason = "getrandom: per-platform code" },
  { crate = "r-efi", reason = "getrandom on UEFI targets; cargo-deny checks every target" },
  { crate = "rustix", reason = "tempfile: file system calls on Unix" },
  { crate = "linux-raw-sys", reason = "rustix: Linux system call definitions" },
  { crate = "bitflags", reason = "rustix: flag types" },
  { crate = "errno", reason = "rustix: reads errno" },
  { crate = "libc", reason = "errno, getrandom and rustix: C library bindings" },
  { crate = "windows-sys", reason = "errno, rustix and tempfile on Windows; cargo-deny checks every target" },
  { crate = "windows-link", reason = "windows-sys: links the Windows API" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
