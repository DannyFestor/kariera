# Every job calls a Make target, so the hooks need nothing on PATH beyond the system tools and rustup's cargo.
# The installed git hooks run the pinned lefthook in bin/, not whichever one is on PATH.
lefthook: bin/lefthook
glob_matcher: doublestar

pre-commit:
  piped: true
  jobs:
    - name: refuse-main
      run: make -s refuse-commit-on-main
    - name: fmt-rust
      glob: "**/*.rs"
      run: make -s fmt-rust FILES="{staged_files}"
      stage_fixed: true
    - name: fmt-typst
      glob: "**/*.typ"
      run: make -s fmt-typst FILES="{staged_files}"
      stage_fixed: true
    - name: lint-shell
      glob: "**/*.sh"
      run: make -s lint-shell FILES="{staged_files}"
    - name: lint-secrets
      run: make -s lint-secrets

commit-msg:
  jobs:
    - name: lint-commit-msg
      run: make -s lint-commit-msg COMMIT_MSG_FILE="{1}"

pre-push:
  piped: true
  jobs:
    # GitHub does not enforce rulesets on private repos of free accounts, and this hook works the same everywhere.
    - name: refuse-main
      run: make -s refuse-push-to-main
      use_stdin: true
    - name: lint
      files: &changed-files scripts/changed-files.sh
      glob: &rust-inputs
        - "**/*.rs"
        - "**/Cargo.toml"
        - Cargo.lock
        - clippy.toml
        - rust-toolchain.toml
      run: make -s lint
    - name: test
      files: *changed-files
      glob: *rust-inputs
      run: make -s test
    - name: deny
      files: *changed-files
      glob:
        - "**/Cargo.toml"
        - Cargo.lock
        - deny.toml
        - crate-boundaries.toml
      run: make -s deny machete
